
name: Build VectorPro Studio MAX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract source code
        run: |
          mkdir source
          unzip -q VectorProStudio-MAX-CloudBuild.zip -d source
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Android APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" dist/VectorProStudioMAX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VectorPro-Studio-MAX-APK
          path: dist/VectorProStudioMAX.apk
          if-no-files-found: error
