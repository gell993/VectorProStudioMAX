
name: Build VectorPro Studio MAX APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract source code
        run: |
          unzip -o VectorProStudio-MAX-CloudBuild-FIXED.zip -d .

      - name: Build Android APK
        run: |
          gradle -p VectorProStudio-Max --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VectorPro-Studio-MAX-APK
          path: VectorProStudio-Max/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
